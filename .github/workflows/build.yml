name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A x64
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: PlateVerb-VST3
          path: build/PlateVerb_artefacts/Release/VST3
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelStrip-VST3
          path: build/ChannelStrip_artefacts/Release/VST3
      - uses: actions/upload-artifact@v4
        with:
          name: N1081-VST3
          path: build/N1081_artefacts/Release/VST3
